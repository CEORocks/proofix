spec:
  replicas: 2
  template:
    metadata:
      annotations:
        proofix.io/profile: fault-required-hostname-anti-affinity
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: null
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: recommendations-api
              topologyKey: kubernetes.io/hostname
