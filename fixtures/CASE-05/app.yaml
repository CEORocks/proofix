apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendations-nginx
  namespace: proofix-case-05
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;
      location /healthz { return 200 'healthy\n'; }
      location / { return 200 'recommendations-ok\n'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations-api
  namespace: proofix-case-05
  labels:
    proofix.io/case: CASE-05
spec:
  replicas: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: recommendations-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendations-api
        proofix.io/case: CASE-05
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: recommendations-api}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: recommendations-api
          image: nginx:1.27.4-alpine@sha256:a71e0884a7f1192ecf5decf062b67d46b54ad63f0cc1b8aa7e705f739a97c2fc
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, timeoutSeconds: 1}
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - name: config
          configMap: {name: recommendations-nginx}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: recommendations-api
  namespace: proofix-case-05
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: recommendations-api}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30075}]
