apiVersion: v1
kind: Pod
metadata:
  name: ledger-primary
  namespace: proofix-case-13
  labels: {app.kubernetes.io/name: ledger-api, proofix.io/case: CASE-13, proofix.io/role: original}
  finalizers: ["proofix.io/hold-termination"]
spec:
  nodeSelector:
    kubernetes.io/hostname: __PRIMARY_NODE__
  securityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  terminationGracePeriodSeconds: 5
  containers:
    - name: ledger
      image: python:3.12.5-alpine3.20@sha256:bb5d0ac04679d78a1258e7dfacdb4d9bdefe9a10480eaf9b4bb09445d076369f
      command: ["python", "/app/server.py"]
      ports: [{name: http, containerPort: 8080}]
      readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2}
      resources:
        requests: {cpu: 20m, memory: 24Mi}
        limits: {cpu: 250m, memory: 96Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        runAsNonRoot: true
        runAsUser: 10001
      volumeMounts:
        - {name: source, mountPath: /app, readOnly: true}
        - {name: ledger, mountPath: /data}
  volumes:
    - name: source
      configMap: {name: ledger-source}
    - name: ledger
      persistentVolumeClaim: {claimName: ledger-data}
