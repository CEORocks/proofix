apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-dependent-api-source
  namespace: proofix-case-02
data:
  server.py: |
    import json
    import random
    import socket
    import struct
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    QUERY_NAME = "backend.bench.proofix"
    EXPECTED_IP = "198.51.100.42"

    def cluster_dns():
        with open("/etc/resolv.conf", encoding="utf-8") as handle:
            for line in handle:
                fields = line.split()
                if len(fields) == 2 and fields[0] == "nameserver":
                    return fields[1]
        raise RuntimeError("pod resolv.conf has no nameserver")

    def encode_name(name):
        return b"".join(bytes([len(label)]) + label.encode("ascii")
                        for label in name.split(".")) + b"\x00"

    def query_dns():
        query_id = random.randrange(0, 65536)
        packet = struct.pack("!HHHHHH", query_id, 0x0100, 1, 0, 0, 0)
        packet += encode_name(QUERY_NAME) + struct.pack("!HH", 1, 1)
        started = time.perf_counter()
        try:
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                sock.settimeout(1.5)
                sock.sendto(packet, (cluster_dns(), 53))
                response, _ = sock.recvfrom(4096)
            latency_ms = (time.perf_counter() - started) * 1000.0
            returned_id, flags, _, answers, _, _ = struct.unpack("!HHHHHH", response[:12])
            if returned_id != query_id:
                raise RuntimeError("DNS transaction ID mismatch")
            rcode = flags & 0x000F
            answer_ip = None
            if rcode == 0 and answers:
                answer_ip = socket.inet_ntoa(response[-4:])
            return {
                "query": QUERY_NAME,
                "cluster_dns": cluster_dns(),
                "rcode": rcode,
                "answer_ip": answer_ip,
                "latency_ms": round(latency_ms, 3),
                "ok": rcode == 0 and answer_ip == EXPECTED_IP,
            }
        except (OSError, RuntimeError, struct.error) as exc:
            return {
                "query": QUERY_NAME,
                "cluster_dns": cluster_dns(),
                "rcode": None,
                "answer_ip": None,
                "latency_ms": round((time.perf_counter() - started) * 1000.0, 3),
                "ok": False,
                "error": str(exc),
            }

    class Handler(BaseHTTPRequestHandler):
        def send_json(self, status, payload):
            body = (json.dumps(payload, sort_keys=True) + "\n").encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path.startswith("/livez"):
                self.send_json(200, {"process": "alive"})
                return
            evidence = query_dns()
            if self.path.startswith("/diagnostics"):
                self.send_json(200, evidence)
                return
            if self.path.startswith("/healthz") or self.path.startswith("/checkout"):
                self.send_json(200 if evidence["ok"] else 503, evidence)
                return
            self.send_json(404, {"error": "not found"})

        def log_message(self, format, *args):
            print(format % args, flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-dependent-api
  namespace: proofix-case-02
  labels:
    app.kubernetes.io/name: dns-dependent-api
    proofix.io/case: CASE-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-dependent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-dependent-api
        proofix.io/case: CASE-02
    spec:
      containers:
        - name: api
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: dns-dependent-api-source
---
apiVersion: v1
kind: Service
metadata:
  name: dns-dependent-api
  namespace: proofix-case-02
  labels:
    proofix.io/case: CASE-02
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dns-dependent-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30072

