apiVersion: v1
kind: ConfigMap
metadata:
  name: proofix-dns-source
  namespace: proofix-case-02
data:
  dns_server.py: |
    import ipaddress
    import os
    import socket
    import struct
    import time

    MODE = os.environ["MODE"]
    DELAY_SECONDS = float(os.environ.get("DELAY_SECONDS", "0"))
    ANSWER_IP = ipaddress.ip_address("198.51.100.42").packed

    def question_end(packet):
        offset = 12
        labels = []
        while True:
            length = packet[offset]
            offset += 1
            if length == 0:
                break
            labels.append(packet[offset:offset + length].decode("ascii").lower())
            offset += length
        return ".".join(labels), offset + 4

    def response(packet):
        if len(packet) < 12:
            return b""
        name, end = question_end(packet)
        if DELAY_SECONDS:
            time.sleep(DELAY_SECONDS)
        query_id = packet[:2]
        question = packet[12:end]
        if MODE == "healthy" and name == "backend.bench.proofix":
            header = query_id + struct.pack("!HHHHH", 0x8180, 1, 1, 0, 0)
            answer = b"\xc0\x0c" + struct.pack("!HHIH", 1, 1, 0, 4) + ANSWER_IP
            return header + question + answer
        header = query_id + struct.pack("!HHHHH", 0x8183, 1, 0, 0, 0)
        return header + question

    sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
    sock.bind(("0.0.0.0", 5353))
    print(f"proofix DNS upstream mode={MODE} delay={DELAY_SECONDS}s", flush=True)
    while True:
        packet, address = sock.recvfrom(4096)
        try:
            reply = response(packet)
            if reply:
                sock.sendto(reply, address)
        except Exception as exc:
            print(f"query error: {exc}", flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofix-dns-good
  namespace: proofix-case-02
  labels:
    proofix.io/case: CASE-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proofix-dns-good
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proofix-dns-good
        proofix.io/case: CASE-02
    spec:
      containers:
        - name: dns
          image: python:3.12-alpine@sha256:d09d15e60962ca365d1cd544a48773bac9d33f2fb1b00f2aa0deec78ade7dc31
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/dns_server.py"]
          env:
            - name: MODE
              value: healthy
            - name: DELAY_SECONDS
              value: "0"
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: proofix-dns-source
---
apiVersion: v1
kind: Service
metadata:
  name: proofix-dns-good
  namespace: proofix-case-02
spec:
  selector:
    app.kubernetes.io/name: proofix-dns-good
  ports:
    - name: dns-udp
      port: 5353
      targetPort: dns-udp
      protocol: UDP
---
