apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-nginx
  namespace: proofix-case-03
data:
  default.conf: |
    server {
      listen 8081;
      access_log off;
      location /healthz { return 200 'healthy\n'; }
      location / { return 200 'catalog-ok\n'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: proofix-case-03
  labels:
    proofix.io/case: CASE-03
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api
        proofix.io/case: CASE-03
    spec:
      containers:
        - name: catalog-api
          image: nginx:1.27.4-alpine@sha256:a71e0884a7f1192ecf5decf062b67d46b54ad63f0cc1b8aa7e705f739a97c2fc
          imagePullPolicy: IfNotPresent
          ports:
            - name: catalog-http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: catalog-http
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: config
          configMap: {name: catalog-nginx}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: proofix-case-03
  labels:
    proofix.io/case: CASE-03
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: catalog-api
  ports:
    - name: http
      port: 80
      targetPort: catalog-http
      nodePort: 30073
