apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: proofix-case-11
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
    - name: proxy
      port: 8082
    - name: admin
      port: 9644
    - name: rpc
      port: 33145
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: proofix-case-11
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        proofix.io/case: CASE-11
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redpanda
          image: mirror.gcr.io/redpandadata/redpanda:v25.3.8@sha256:7ac11e18ee95a18237154f6d8d79631cdeb4e4eff44bf365a9d3acecc18209fb
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              exec rpk redpanda start \
                --mode dev-container \
                --smp 1 \
                --memory 768M \
                --default-log-level=warn \
                --kafka-addr internal://0.0.0.0:9092 \
                --advertise-kafka-addr internal://redpanda-0.redpanda.proofix-case-11.svc.cluster.local:9092 \
                --pandaproxy-addr 0.0.0.0:8082 \
                --advertise-pandaproxy-addr redpanda-0.redpanda.proofix-case-11.svc.cluster.local:8082 \
                --rpc-addr 0.0.0.0:33145 \
                --advertise-rpc-addr redpanda-0.redpanda.proofix-case-11.svc.cluster.local:33145
          ports:
            - name: kafka
              containerPort: 9092
            - name: proxy
              containerPort: 8082
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          proofix.io/case: CASE-11
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 3Gi
