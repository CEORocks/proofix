apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-nginx
  namespace: proofix-case-06
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;
      location /healthz { return 200 'healthy\n'; }
      location / { return 200 'checkout-ok\n'; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: proofix-case-06
  labels:
    proofix.io/case: CASE-06
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: checkout-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        proofix.io/case: CASE-06
    spec:
      containers:
        - name: checkout-api
          image: nginx:1.27.4-alpine@sha256:a71e0884a7f1192ecf5decf062b67d46b54ad63f0cc1b8aa7e705f739a97c2fc
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, timeoutSeconds: 1}
          resources:
            requests: {cpu: 100m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
      volumes:
        - name: config
          configMap: {name: checkout-nginx}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stale-canary
  namespace: proofix-case-06
  labels:
    proofix.io/case: CASE-06
    proofix.io/benchmark-owned: "true"
    proofix.io/live-traffic: "false"
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: stale-canary}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stale-canary
        proofix.io/benchmark-owned: "true"
        proofix.io/live-traffic: "false"
    spec:
      containers:
        - name: stale-canary
          image: busybox:1.36.1@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "trap 'exit 0' TERM; while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 300m, memory: 8Mi}
            limits: {cpu: 300m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: proofix-case-06
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: checkout-api}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30076}]
