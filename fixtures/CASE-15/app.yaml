apiVersion: v1
kind: ConfigMap
metadata:
  name: healthy-shop-source
  namespace: proofix-case-15
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import json

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            body = json.dumps({"ok": True, "service": "healthy-shop"}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *_args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-shop
  namespace: proofix-case-15
  labels:
    proofix.io/case: CASE-15
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: healthy-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthy-shop
        proofix.io/case: CASE-15
    spec:
      containers:
        - name: shop
          image: python:3.12.5-alpine3.20@sha256:bb5d0ac04679d78a1258e7dfacdb4d9bdefe9a10480eaf9b4bb09445d076369f
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 250m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - {name: source, mountPath: /app, readOnly: true}
      volumes:
        - name: source
          configMap: {name: healthy-shop-source}
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-shop
  namespace: proofix-case-15
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: healthy-shop
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30115}
